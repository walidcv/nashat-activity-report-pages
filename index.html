<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#17324d">
  <title>منشئ تقارير الأنشطة المدرسية</title>
  <style>
    :root {
      color-scheme: light;
      --navy: #17324d;
      --teal: #168c86;
      --ink: #26394d;
      --muted: #718096;
      --line: #e2e8f0;
      --background: #f3f6fb;
      --white: #fff;
      font-family: Tahoma, Arial, sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background:
        radial-gradient(ellipse at 90% 0, rgba(22, 140, 134, 0.1), transparent 34rem),
        var(--background);
      color: var(--ink);
      direction: rtl;
    }

    .page-shell { width: min(960px, calc(100% - 32px)); margin: 40px auto; }
    .hero {
      display: flex;
      align-items: center;
      gap: 20px;
      margin-bottom: 28px;
      padding: 28px 32px;
      border-radius: 22px;
      background: linear-gradient(120deg, #17324d, #20566a);
      color: var(--white);
      box-shadow: 0 15px 35px rgba(23, 50, 77, 0.14);
    }
    .hero-mark {
      display: grid;
      flex: 0 0 62px;
      width: 62px;
      height: 62px;
      place-items: center;
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.11);
      font-size: 34px;
      font-weight: 700;
    }
    .eyebrow { margin: 0 0 5px; color: #a9e2dc; font-size: 13px; font-weight: 600; }
    h1, h2, p { margin-top: 0; }
    h1 { margin-bottom: 6px; font-size: clamp(22px, 4vw, 30px); }
    .hero-copy { margin-bottom: 0; color: #d4e3eb; font-size: 14px; }
    .card {
      margin-bottom: 18px;
      padding: 25px;
      border: 1px solid rgba(226, 232, 240, 0.9);
      border-radius: 18px;
      background: var(--white);
      box-shadow: 0 8px 24px rgba(23, 50, 77, 0.045);
    }
    .section-heading { display: flex; align-items: center; gap: 12px; margin-bottom: 21px; }
    .step {
      display: grid;
      flex: 0 0 40px;
      width: 40px;
      height: 40px;
      place-items: center;
      border-radius: 13px;
      background: #e7f5f3;
      color: var(--teal);
      font-size: 18px;
      font-weight: 700;
    }
    .section-heading h2 { margin-bottom: 2px; color: var(--navy); font-size: 18px; }
    .section-heading p, .submit-row p { margin-bottom: 0; color: var(--muted); font-size: 13px; }
    .field-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }
    .field { display: grid; gap: 8px; margin-bottom: 17px; color: var(--ink); font-size: 14px; font-weight: 600; }
    .field b { color: #d04444; }
    input, textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 11px;
      outline: 0;
      background: #fbfcfe;
      color: var(--ink);
      font: inherit;
      font-weight: 400;
      text-align: right;
    }
    input:not([type="file"]) { height: 47px; padding: 0 13px; }
    textarea { min-height: 122px; padding: 12px 13px; direction: rtl; text-align: right; font-family: system-ui, "Noto Sans Arabic", Tahoma, Arial, sans-serif; font-size: 16px; line-height: 1.8; resize: vertical; }
    input:focus, textarea:focus { border-color: var(--teal); box-shadow: 0 0 0 3px rgba(22, 140, 134, 0.12); }
    ::placeholder { color: #a1adba; }
    .photo-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 13px; }
    .upload-card {
      display: flex;
      min-height: 150px;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 7px;
      padding: 16px;
      border: 1px dashed #b8c9d5;
      border-radius: 14px;
      background: #f8fafc;
      text-align: center;
      cursor: pointer;
    }
    .upload-icon {
      display: grid;
      width: 34px;
      height: 34px;
      place-items: center;
      border-radius: 50%;
      background: #e7f5f3;
      color: var(--teal);
      font-size: 22px;
    }
    .upload-card strong { color: var(--navy); font-size: 14px; }
    .upload-hint { color: var(--muted); font-size: 12px; }
    .upload-card input { max-width: 100%; border: 0; background: transparent; color: var(--muted); font-size: 11px; }
    .submit-row { display: flex; align-items: center; justify-content: space-between; gap: 18px; margin: 24px 2px 0; }
    .status { margin-top: 9px !important; color: var(--teal) !important; line-height: 1.7; }
    button {
      min-height: 52px;
      padding: 0 24px;
      border: 0;
      border-radius: 12px;
      background: var(--teal);
      color: var(--white);
      font: inherit;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 7px 16px rgba(22, 140, 134, 0.2);
    }
    button:hover { background: #11756f; }
    button:disabled { opacity: .65; cursor: wait; }
    button span { padding-left: 7px; font-size: 20px; }
    .inline-preview { width: 100%; min-height: 100vh; background: #f3f7f8; }
    .preview-toolbar { position: sticky; top: 0; z-index: 2; display: flex; justify-content: center; padding: 12px; background: white; box-shadow: 0 2px 12px #17324d22; }
    .preview-toolbar button { min-height: 44px; }
    .preview-status { margin: 0; padding: 8px 16px; color: var(--muted); text-align: center; }
    .pdf-pages { display: grid; justify-items: center; gap: 14px; padding: 14px 8px 28px; }
    .pdf-page { width: min(100%, 820px); overflow: hidden; background: white; box-shadow: 0 4px 18px #17324d20; }
    .pdf-page canvas { display: block; width: 100%; height: auto; }
    .alert { margin: 0 0 18px; padding: 14px 17px; border: 1px solid #f2c1bb; border-radius: 12px; background: #fff5f3; color: #a52b20; }
    footer { padding: 24px 0 5px; color: var(--muted); font-size: 12px; text-align: center; }

    @media (max-width: 650px) {
      .page-shell { width: min(100% - 22px, 520px); margin: 16px auto; }
      .hero { align-items: flex-start; gap: 13px; margin-bottom: 15px; padding: 20px 17px; border-radius: 17px; }
      .hero-mark { flex-basis: 46px; width: 46px; height: 46px; border-radius: 14px; font-size: 27px; }
      .hero-copy { font-size: 12px; line-height: 1.7; }
      .card { margin-bottom: 13px; padding: 19px 15px; border-radius: 15px; }
      .field-grid, .photo-grid { grid-template-columns: 1fr; gap: 0; }
      .upload-card { min-height: 125px; }
      .submit-row { align-items: stretch; flex-direction: column; }
      .submit-row button { width: 100%; }
      .pdf-pages { gap: 10px; padding: 10px 5px 20px; }
    }

      .pdf-report {
      position: fixed;
      top: 0;
      left: -10000px;
      width: 190mm;
      padding: 0;
      color: #26394d;
      background: white;
      direction: rtl;
      font-family: Tahoma, Arial, sans-serif;
      font-size: 10pt;
    }
    .pdf-header {
      display: flex;
      min-height: 36mm;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      margin-bottom: 8mm;
      padding: 4mm;
      border-radius: 4mm;
      background: #17324d;
      color: white;
      text-align: center;
    }
    .pdf-logo { width: 18mm; height: 14mm; object-fit: contain; margin-bottom: 1mm; }
    .pdf-header strong { font-size: 13pt; }
    .pdf-header small { margin-top: 1mm; font-size: 9pt; }
    .pdf-title {
      margin: 0 0 5mm;
      padding: 5mm;
      border-radius: 3mm;
      background: #168c86;
      color: white;
      font-size: 16pt;
      text-align: center;
    }
    .pdf-info { display: grid; grid-template-columns: 1fr 1fr; gap: 3mm; margin-bottom: 5mm; }
    .pdf-info div, .pdf-section { break-inside: avoid; page-break-inside: avoid; }
    .pdf-info div { padding: 3mm; border: .3mm solid #dce7eb; border-radius: 2mm; background: #f4f8fa; }
    .pdf-info b { display: block; margin-bottom: 1mm; color: #168c86; font-size: 9pt; }
    .pdf-section { margin-bottom: 4mm; border: .3mm solid #dce7eb; border-radius: 2mm; overflow: hidden; }
    .pdf-section h3 { margin: 0; padding: 2.5mm 3mm; background: #168c86; color: white; font-size: 10pt; }
    .pdf-section p { margin: 0; padding: 3mm; white-space: pre-wrap; line-height: 1.7; overflow-wrap: anywhere; }
    .pdf-photos { display: flex; gap: 3mm; flex-wrap: wrap; margin: 3mm 0 5mm; }
    .pdf-photo { width: 58mm; text-align: center; break-inside: avoid; page-break-inside: avoid; }
    .pdf-photo img { display: block; width: 100%; height: 38mm; object-fit: cover; border: .3mm solid #dce7eb; }
    .pdf-photo span { display: block; margin-top: 1mm; font-weight: bold; }
    .pdf-signatures { display: flex; justify-content: space-between; gap: 10mm; margin-top: 10mm; padding-top: 4mm; border-top: .3mm solid #dce7eb; }
    .pdf-signatures div { line-height: 1.8; }
    .pdf-footer { margin-top: 7mm; padding-top: 3mm; border-top: .3mm solid #dce7eb; color: #718096; font-size: 8pt; text-align: center; }
    @media print { .pdf-report { position: static; left: auto; width: 190mm; } }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js" defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js" defer></script>
  <script src="app.js?v=20261002-4100" defer></script>
</head>
<body>
  <main class="page-shell">
    <header class="hero">
      <div class="hero-mark" aria-hidden="true">ن</div>
      <div>
        <p class="eyebrow">وزارة التعليم · تقارير الأنشطة</p>
        <h1>منشئ تقارير الأنشطة المدرسية</h1>
        <p class="hero-copy">أدخل بيانات البرنامج وأرفق شواهده، ثم اعرض التقرير بصيغة PDF وشاركه من عارض الملفات.</p>
      </div>
    </header>

    <div id="error-message" class="alert" role="alert" hidden></div>

    <form id="report-form">
      <section class="card" aria-labelledby="report-heading">
        <div class="section-heading">
          <span class="step">١</span>
          <div><h2 id="report-heading">بيانات التقرير</h2><p>الحقول المميزة بنجمة مطلوبة.</p></div>
        </div>
        <div class="field-grid">
          <label class="field"><span>اسم المدرسة <b>*</b></span><input name="school_name" maxlength="200" required placeholder="اكتب اسم المدرسة"></label>
          <label class="field"><span>عنوان التقرير <b>*</b></span><input name="title" maxlength="200" required placeholder="مثال: برنامج تعزيز القراءة"></label>
          <label class="field"><span>اليوم والتاريخ</span><input name="date" maxlength="200" id="report-date"></label>
          <label class="field"><span>عدد المشاركين</span><input name="participants" maxlength="200" placeholder="أدخل عدد المشاركين"></label>
          <label class="field"><span>المنفذ</span><input name="executor" maxlength="200" placeholder="اسم منفذ البرنامج"></label>
          <label class="field"><span>مشرف التنفيذ</span><input name="supervisor" maxlength="200" placeholder="اسم مشرف التنفيذ"></label>
        </div>
      </section>

      <section class="card" aria-labelledby="details-heading">
        <div class="section-heading">
          <span class="step">٢</span>
          <div><h2 id="details-heading">تفاصيل البرنامج</h2><p>اكتب الأهداف والوصف بالتفصيل الذي تحتاجه.</p></div>
        </div>
<textarea name="goals" dir="rtl" rows="5"
<textarea name="description" dir="rtl" rows="6"
      </section>

      <section class="card" aria-labelledby="photos-heading">
        <div class="section-heading">
          <span class="step">٣</span>
          <div><h2 id="photos-heading">شواهد البرنامج</h2><p>يمكنك إرفاق حتى ثلاث صور؛ الحد الأقصى للصورة 5 ميغابايت.</p></div>
        </div>
        <div class="photo-grid">
          <label class="upload-card"><span class="upload-icon" aria-hidden="true">＋</span><strong>الشاهد 1</strong><span class="upload-hint">اختر صورة من جهازك</span><input type="file" name="image_1" accept="image/*"></label>
          <label class="upload-card"><span class="upload-icon" aria-hidden="true">＋</span><strong>الشاهد 2</strong><span class="upload-hint">اختر صورة من جهازك</span><input type="file" name="image_2" accept="image/*"></label>
          <label class="upload-card"><span class="upload-icon" aria-hidden="true">＋</span><strong>الشاهد 3</strong><span class="upload-hint">اختر صورة من جهازك</span><input type="file" name="image_3" accept="image/*"></label>
        </div>
      </section>

      <div class="submit-row">
        <div>
          <p>يُنشأ ملف PDF على جهازك؛ لا تُرفع بياناتك أو صورك إلى خادم.</p>
          <p id="status-message" class="status" role="status" aria-live="polite" hidden></p>
        </div>
        <button id="download-button" type="submit">معاينة التقرير PDF</button>
      </div>
    </form>
    <footer>حقوق البرنامج محفوظة لدى أ/ وليد بن عبدالعزيز البليهد</footer>
  </main>
  <section id="inline-preview" class="inline-preview" hidden>
    <div class="preview-toolbar">
      <button id="share-pdf" type="button">مشاركة ملف PDF</button>
    </div>
    <p id="preview-status" class="preview-status" role="status" aria-live="polite"></p>
    <div id="pdf-pages" class="pdf-pages" aria-label="صفحات تقرير النشاط بصيغة PDF"></div>
  </section>
  <section id="pdf-report" class="pdf-report" aria-hidden="true"></section>
</body>
</html>
